name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*' # Triggers for tags like v1.0.0

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4


      - name: Grant execute permission for Gradlew
        run: chmod +x ./gradlew

      - name: Set up release signing
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo "No signing key configured, building unsigned APKs"
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/keystore"
          echo "$SIGNING_KEY" | base64 --decode > "$RUNNER_TEMP/keystore/release.jks"
          {
            echo "KEYSTORE_PATH=$RUNNER_TEMP/keystore/release.jks"
            echo "KEYSTORE_PASSWORD=$KEY_STORE_PASSWORD"
            echo "KEY_ALIAS=$KEY_ALIAS"
            echo "KEY_PASSWORD=$KEY_PASSWORD"
            echo "KEYSTORE_TYPE=PKCS12"
          } > local.properties
          echo "Keystore configured"

      - name: Build Release APKs (with architecture splits)
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: List APK files
        run: |
          echo "APK files built:"
          find app/build/outputs/apk/release -name "*.apk" -type f -exec ls -lh {} \;

      - name: Rename APKs for GitHub Release
        run: |
          cd app/build/outputs/apk/release
          for f in *.apk; do
            [ -e "$f" ] || continue
            case "$f" in
              *arm64-v8a*) target="vuzol-android-arm64.apk" ;;
              *x86_64*) target="vuzol-android-x86_64.apk" ;;
              *universal*) target="vuzol-android-universal.apk" ;;
              *) target="vuzol-android-$f" ;;
            esac
            [ "$f" = "$target" ] || mv "$f" "$target"
          done

      - name: Upload APKs as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vuzol-android-release-${{ github.ref_name }}
          path: app/build/outputs/apk/release/*.apk
          retention-days: 3
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v5
        with:
          name: vuzol-android-release-${{ github.ref_name }}
          path: release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/vuzol-android-arm64.apk
            release/vuzol-android-x86_64.apk
            release/vuzol-android-universal.apk
          name: Release ${{ github.ref_name }}
          body: |
            **vuzol-android-arm64.apk** - ARM64 (most phones)
            **vuzol-android-x86_64.apk** - x86_64 (Chromebooks, tablets)
            **vuzol-android-universal.apk** - All architectures (fallback)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
